services:
  - type: web
    name: whatsbot-crm-cloud-v7
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NO_OPEN
        value: "1"
      - key: WHATSBOT_HOST
        value: "0.0.0.0"
      - key: WHATSBOT_DATA_DIR
        value: "/data"
    disk:
      name: whatsbot-data
      mountPath: /data
      sizeGB: 10
