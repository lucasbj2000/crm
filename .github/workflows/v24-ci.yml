name: CRM V26 production checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev

      - name: Syntax checks
        run: |
          node --check app/server.mjs
          node --check app/lib/domain-v26.mjs
          node --check app/lib/v24-server-patches.mjs
          node --check app/lib/v24-cloud-patches.mjs
          node --check app/lib/v24-1-server-patches.mjs
          node --check app/lib/v25-4-server-patches.mjs
          node --check app/lib/v25-6-security-patches.mjs
          node --check app/lib/v25-7-form-patches.mjs
          node --check app/lib/v25-8-report-ai-patches.mjs
          node --check app/lib/v25-9-support-patches.mjs
          node --check app/lib/v25-10-social-patches.mjs
          node --check app/lib/v25-11-omnichannel-patches.mjs
          node --check app/lib/v25-12-social-platform-patches.mjs
          node --check app/lib/v26-2-whatsapp-patches.mjs
          node --check app/lib/v26-3-qr-recovery-patches.mjs
          node --check app/lib/v26-4-platform-reliability-catalog-patches.mjs
          node --check app/lib/v26-5-media-reliability-patches.mjs
          node --check app/lib/v26-6-media-retry-patches.mjs
          node --check app/lib/v26-8-whatsapp-edit-patches.mjs
          node --check app/lib/v26-9-access-control-patches.mjs
          node --check app/lib/v26-9-access-control-wrapper.mjs
          node --check app/lib/v26-10-live-support-bot-lines-patches.mjs
          node --check app/lib/v26-11-message-reliability-patches.mjs
          node --check app/lib/v26-11-1-message-queue-safety-patches.mjs
          node --check app/lib/v26-12-live-support-fluency-patches.mjs
          node --check app/public/app.js
          node --check app/public/v22.js
          node --check app/public/v24.js
          node --check app/public/v24-1.js
          node --check app/public/v25-2-1.js
          node --check app/public/v25-3.js
          node --check app/public/v25-4.js
          node --check app/public/v25-4-1.js
          node --check app/public/v25-5.js
          node --check app/public/v25-6.js
          node --check app/public/v25-7.js
          node --check app/public/v25-8.js
          node --check app/public/v25-8-1.js
          node --check app/public/v25-9.js
          node --check app/public/v25-10.js
          node --check app/public/v25-11.js
          node --check app/public/v25-12.js
          node --check app/public/v26-1.js
          node --check app/public/v26-2.js
          node --check app/public/v26-3.js
          node --check app/public/v26-4.js
          node --check app/public/v26-6.js
          node --check app/public/v26-7.js
          node --check app/public/v26-8.js
          node --check app/public/v26-9.js
          node --check app/public/v26-10.js
          node --check app/public/form-public.js
          node --check app/public/v25.js
          node --check app/public/sw.js
          node --check gateway/gateway.mjs
          node --check gateway/lib/v25-gateway-patches.mjs
          node --check gateway/lib/v25-5-gateway-patches.mjs
          node --check gateway/lib/v25-6-gateway-security-patches.mjs
          node --check gateway/lib/v25-12-social-platform-patches.mjs
          node --check gateway/lib/v26-4-tenant-reliability-patches.mjs
          node --check gateway/public/master-v25-5.js
          node --check gateway/public/master-v25-5-1.js
          node --check gateway/public/master-v25-12.js
          node --check gateway/v25-gateway.mjs
          node --check gateway/setup-master.mjs
          bash -n start-vps.sh
          bash -n scripts/deploy-vps.sh

      - name: Validate V24/V24.1 patch anchors
        run: node app/test/v24-patches.mjs

      - name: Validate V24.1 UI contracts
        run: node app/test/v24-1-ui.mjs

      - name: Validate V25 conversation UI
        run: node app/test/v25-ui.mjs

      - name: Validate V25.3 navigation and responsive
        run: node app/test/v25-3-navigation-responsive.mjs

      - name: Validate V25.4 contacts and admin delete
        run: node app/test/v25-4-admin-contacts.mjs

      - name: Validate V25.4.2 compact delete UI
        run: node app/test/v25-4-2-compact-delete.mjs

      - name: Validate V25.5 PWA install
        run: node app/test/v25-5-pwa.mjs

      - name: Validate V25.6 mobile and tenant security
        run: node app/test/v25-6-mobile-security.mjs

      - name: Validate V25.7 form designer and mobile first
        run: node app/test/v25-7-form-mobile.mjs

      - name: Validate V25.8.1 AI reports and corporate PDF
        run: node app/test/v25-8-ai-reports.mjs

      - name: Validate V25.9 contextual support
        run: node app/test/v25-9-support.mjs

      - name: Validate V25.10 social channels
        run: node app/test/v25-10-social-channels.mjs

      - name: Validate V25.12 OAuth global and unified inbox
        run: node app/test/v25-11-oauth-unified-inbox.mjs

      - name: Validate V26.1.1 stable premium UI
        run: node app/test/v26-ui.mjs

      - name: Validate V26.2 QR, full history and message bubbles
        run: node app/test/v26-2-whatsapp-history.mjs

      - name: Validate V26.3 QR recovery
        run: node app/test/v26-3-qr-recovery.mjs

      - name: Validate V26.4 QR preflight and external catalogs
        run: node app/test/v26-4-catalog-reliability.mjs

      - name: Validate V26.5 incoming multimedia reliability
        run: node app/test/v26-5-media-reliability.mjs

      - name: Validate V26.6 media retry and silent sync
        run: node app/test/v26-6-media-silent-sync.mjs

      - name: Validate V26.8 WhatsApp edited messages
        run: node app/test/v26-8-whatsapp-edits.mjs

      - name: Validate V26.9 roles and granular access
        run: node app/test/v26-9-access-control.mjs

      - name: Validate V26.9.2 branding contract
        run: node app/test/v26-9-branding-access.mjs

      - name: Validate V26.10 live support and per-line bot
        run: node app/test/v26-10-live-support-bot-lines.mjs

      - name: Validate V26.11 reliable messaging
        run: node app/test/v26-11-message-reliability.mjs

      - name: Validate V26.12 live support fluency
        run: node app/test/v26-12-live-support-fluency.mjs

      - name: Validate V25 master/login UI
        run: node gateway/test/v25-master-ui.mjs

      - name: Validate V25.5.1 master personnel and company deletion
        run: node gateway/test/v25-5-master-personnel.mjs

      - name: Validate V25.6 gateway security
        run: node gateway/test/v25-6-security.mjs

      - name: Validate V25.12 global social platform
        run: node gateway/test/v25-12-social-platform.mjs

      - name: Validate V26.4 tenant QR reliability
        run: node gateway/test/v26-4-tenant-reliability.mjs

      - name: Feature smoke
        run: node app/test/feature-smoke.mjs

      - name: V25 message smoke
        run: node app/test/v25-message-smoke.mjs

      - name: V24 transfer smoke
        run: node app/test/v24-transfer-smoke.mjs

      - name: Validate Gateway V25 patch anchors
        run: node gateway/test/v25-gateway-patches.mjs

      - name: Master isolation legacy
        run: node gateway/test/master-isolation.mjs

      - name: V25 control plane and strict isolation
        run: node gateway/test/v25-control-plane.mjs
