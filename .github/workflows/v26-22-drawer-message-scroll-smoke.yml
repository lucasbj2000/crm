name: V26.22 drawer message scroll smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drawer-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Syntax checks
        run: |
          node --check app/lib/v26-17-chat-refresh-patches.mjs
          node --check app/server.mjs
      - name: Validate V26.22 drawer scroll
        run: node app/test/v26-22-drawer-message-scroll.mjs
      - name: Validate served app bundle
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          LOG="$TMP/server.log"
          BUNDLE="$TMP/app.js"
          PORT=6222 WHATSBOT_HOST=127.0.0.1 WHATSBOT_DATA_DIR="$TMP/data" WHATSAPP_MOCK=1 NO_OPEN=1 CRM_TENANT_SLUG=v2622-runtime CRM_PUBLIC_BASE_URL=http://127.0.0.1:6222 node app/server.mjs >"$LOG" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6222/api/health >/dev/null 2>&1; then OK=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep .2
          done
          if test "$OK" -eq 1; then
            curl -fsS http://127.0.0.1:6222/app.js -o "$BUNDLE"
            grep -q "grid-auto-rows:max-content" "$BUNDLE"
            grep -q "scroll-behavior:auto" "$BUNDLE"
            grep -q "drawerMessagesMaxScroll" "$BUNDLE"
            grep -q "shouldScrollBottom" "$BUNDLE"
            if grep -q "wheelScrollBound" "$BUNDLE"; then
              echo "El bundle no debe conservar el manejador manual de wheel."
              exit 1
            fi
          fi
          cat "$LOG" || true
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; fi
          test "$OK" -eq 1
