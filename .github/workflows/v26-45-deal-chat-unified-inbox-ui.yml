name: V26.45 deal chat unified inbox UI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/v26-45-deal-chat-unified-inbox-ui"

permissions:
  contents: read

jobs:
  deal-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-45-deal-chat-unified-inbox-ui-patches.mjs
          node --check app/server.mjs
          node app/test/v26-45-deal-chat-unified-inbox-ui.mjs
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3065"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2645-data
        run: |
          node app/server.mjs >/tmp/v2645.log 2>&1 &
          echo $! >/tmp/v2645.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3065/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3065/app.js -o /tmp/v2645-app.js
          node --check /tmp/v2645-app.js
          grep -F 'V26.45 DEAL_CHAT_UNIFIED_INBOX_UI' /tmp/v2645-app.js
          grep -F 'v2645-deal-chat-unified-style' /tmp/v2645-app.js
          grep -F 'v2511-messages' /tmp/v2645-app.js
          grep -F 'v2511-message' /tmp/v2645-app.js
          grep -F 'v2511-composer' /tmp/v2645-app.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2645.pid || kill $(cat /tmp/v2645.pid) 2>/dev/null || true
          tail -120 /tmp/v2645.log 2>/dev/null || true
