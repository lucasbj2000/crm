name: V26.42 dedicated mobile message scroll

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-42-dedicated-mobile-message-scroll"

permissions:
  contents: read

jobs:
  mobile-message-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-42-dedicated-mobile-message-scroll-patches.mjs
          node --check app/server.mjs
          node app/test/v26-42-dedicated-mobile-message-scroll.mjs
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3062"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2642-data
        run: |
          node app/server.mjs >/tmp/v2642.log 2>&1 &
          echo $! >/tmp/v2642.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3062/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3062/app.js -o /tmp/v2642-app.js
          node --check /tmp/v2642-app.js
          grep -F 'V26.42 DEDICATED_MOBILE_MESSAGE_SCROLL' /tmp/v2642-app.js
          grep -F 'v2642-dedicated-message-scroll-style' /tmp/v2642-app.js
          grep -F 'function v2641ConversationScroller(list = document.querySelector("#drawer-messages"))' /tmp/v2642-app.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2642.pid || kill $(cat /tmp/v2642.pid) 2>/dev/null || true
          tail -80 /tmp/v2642.log 2>/dev/null || true
