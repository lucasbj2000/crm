name: V26.60 static mobile secondary tools hide

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-60-mobile-hide-secondary-tools-static"

permissions:
  contents: read

jobs:
  mobile-static-hide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Validate V26.60
        run: |
          node app/test/v26-57-mobile-hide-secondary-composer.mjs
          node app/test/v26-60-mobile-static-hide-secondary-tools.mjs
          bash -n scripts/deploy-vps.sh
          grep -F 'v26-60-mobile-static-hide-secondary-tools.mjs' scripts/deploy-vps.sh
      - name: Runtime assets
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3074"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2660-data
        run: |
          node app/server.mjs >/tmp/v2660.log 2>&1 &
          echo $! >/tmp/v2660.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3074/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3074/styles.css -o /tmp/v2660-styles.css
          grep -F 'V26.60 MOBILE STATIC HIDE SECONDARY TOOLS' /tmp/v2660-styles.css
          grep -F '#deal-drawer .chat-only-section.v2645-deal-chat .v2645-ai-row' /tmp/v2660-styles.css
          grep -F '#deal-drawer .chat-only-section.v2645-deal-chat .quick-reply-bar' /tmp/v2660-styles.css
          curl -fsS http://127.0.0.1:3074/ -o /tmp/v2660-index.html
          grep -F '/styles.css?v=26.60-mobile-static-hide-secondary-tools' /tmp/v2660-index.html
          curl -fsS http://127.0.0.1:3074/sw.js -o /tmp/v2660-sw.js
          grep -F 'whatsbot-mobile-v26-60-mobile-static-hide-secondary-tools' /tmp/v2660-sw.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2660.pid || kill $(cat /tmp/v2660.pid) 2>/dev/null || true
          tail -120 /tmp/v2660.log 2>/dev/null || true
