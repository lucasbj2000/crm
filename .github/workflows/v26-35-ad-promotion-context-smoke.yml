name: V26.35 ad promotion context smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ad-promotion-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Syntax checks
        run: |
          node --check app/server.mjs
          node --check app/server-core.mjs
          node --check app/lib/v26-35-ad-promotion-context-patches.mjs
          node --check app/test/v26-35-ad-promotion-context.mjs
      - name: Validate V26.35 behavior
        run: node app/test/v26-35-ad-promotion-context.mjs
      - name: Validate generated runtime contracts
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3055"
          WHATSBOT_HOST: "127.0.0.1"
        run: |
          export WHATSBOT_DATA_DIR="$RUNNER_TEMP/v2635-generated"
          node app/server.mjs > /tmp/v2635-server.log 2>&1 &
          echo $! > /tmp/v2635-server.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3055/api/health >/dev/null; then break; fi
            sleep 0.3
          done
          test -f app/.server-v24.generated.mjs
          node --check app/.server-v24.generated.mjs
          grep -F 'function v2635CloudAdReferral' app/.server-v24.generated.mjs
          grep -F 'function v2635QrAdReferral' app/.server-v24.generated.mjs
          grep -F 'PAUTA / PROMOCIÓN DE ORIGEN' app/.server-v24.generated.mjs
      - name: Stop mock CRM
        if: always()
        run: |
          if [ -f /tmp/v2635-server.pid ]; then kill $(cat /tmp/v2635-server.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2635-server.log ]; then tail -140 /tmp/v2635-server.log || true; fi
