name: Copilot source export v2

on:
  push:
    branches:
      - copilot-source-export-20260915

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source commit
        uses: actions/checkout@v4
        with:
          ref: d105d8b978c00a786421f6847d81db841b360ddb
          fetch-depth: 1

      - name: Build literal redacted consolidated source export
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / "copilot-source-export"
          OUT.mkdir(exist_ok=True)
          PART_LIMIT = 1_800_000
          SOURCE_COMMIT = "d105d8b978c00a786421f6847d81db841b360ddb"

          EXCLUDED_DIR_NAMES = {"node_modules", ".git", "dist", "build"}
          BINARY_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".bmp", ".tif", ".tiff",
              ".pdf", ".zip", ".gz", ".tgz", ".tar", ".7z", ".rar", ".woff", ".woff2", ".ttf", ".otf",
              ".mp3", ".wav", ".ogg", ".m4a", ".mp4", ".mov", ".avi", ".webm", ".sqlite", ".db", ".bin",
              ".exe", ".dll", ".so", ".dylib", ".class", ".jar", ".pyc"
          }
          ENV_NAMES = {".env", ".env.local", ".env.production", ".env.development", ".env.test"}
          SECRET_NAME = r"(?:secret|token|password|passwd|pwd|api[_-]?key|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|auth[_-]?token|webhook[_-]?secret|signing[_-]?key|connection[_-]?string)"
          PEM_RE = re.compile(
              r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----",
              re.S,
          )
          BEARER_LITERAL_RE = re.compile(r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]{20,}")
          JSON_JS_SECRET_LITERAL_RE = re.compile(
              rf'''(?i)(["']?{SECRET_NAME}["']?\s*:\s*)(["'])([^"'\r\n]{{8,}})(\2)'''
          )
          ASSIGN_SECRET_LITERAL_RE = re.compile(
              rf'''(?im)^(\s*(?:export\s+)?[A-Za-z_][A-Za-z0-9_]*{SECRET_NAME}[A-Za-z0-9_]*\s*=\s*)(["'])([^"'\r\n]{{8,}})(\2)(\s*;?\s*)$'''
          )

          def tracked_files():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          def excluded_path(path: str) -> bool:
              parts = Path(path).parts
              return any(p in EXCLUDED_DIR_NAMES for p in parts) or Path(path).suffix.lower() in BINARY_EXTS

          def read_text(path: Path):
              data = path.read_bytes()
              if b"\x00" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  try:
                      return data.decode("latin-1")
                  except Exception:
                      return None

          def redact_env_file(text: str) -> str:
              out = []
              for raw_line in text.splitlines(keepends=True):
                  nl = "\n" if raw_line.endswith("\n") else ""
                  line = raw_line[:-1] if nl else raw_line
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      out.append(raw_line)
                      continue
                  m = re.match(r"^(\s*(?:export\s+)?[A-Za-z_][A-Za-z0-9_]*\s*=\s*)(.*)$", line)
                  if m:
                      out.append(m.group(1) + "***REDACTED***" + nl)
                  else:
                      out.append("***REDACTED***" + nl)
              return "".join(out)

          def redact_secrets(path: str, text: str) -> str:
              name = Path(path).name.lower()
              if name in ENV_NAMES or name.startswith(".env."):
                  return redact_env_file(text)
              # Preserve source code exactly unless it contains an actual literal credential/key.
              text = PEM_RE.sub("***REDACTED_PRIVATE_KEY***", text)
              text = BEARER_LITERAL_RE.sub(r"\1***REDACTED***", text)
              text = JSON_JS_SECRET_LITERAL_RE.sub(lambda m: f"{m.group(1)}{m.group(2)}***REDACTED***{m.group(4)}", text)
              text = ASSIGN_SECRET_LITERAL_RE.sub(lambda m: f"{m.group(1)}{m.group(2)}***REDACTED***{m.group(4)}{m.group(5)}", text)
              return text

          all_paths = tracked_files()
          selected = []
          skipped_binary = []
          for rel in all_paths:
              if excluded_path(rel):
                  skipped_binary.append(rel)
                  continue
              p = ROOT / rel
              if not p.is_file():
                  continue
              text = read_text(p)
              if text is None:
                  skipped_binary.append(rel)
                  continue
              selected.append((rel, redact_secrets(rel, text)))
          selected.sort(key=lambda x: x[0].lower())

          def make_tree(paths):
              root = {}
              for path in paths:
                  node = root
                  parts = Path(path).parts
                  for part in parts[:-1]:
                      node = node.setdefault(part, {})
                  node.setdefault("__files__", []).append(parts[-1])
              lines = ["."]
              def walk(node, prefix=""):
                  dirs = sorted([k for k in node if k != "__files__"], key=str.lower)
                  files = sorted(node.get("__files__", []), key=str.lower)
                  entries = [(d, True) for d in dirs] + [(f, False) for f in files]
                  for idx, (name, is_dir) in enumerate(entries):
                      last = idx == len(entries) - 1
                      lines.append(prefix + ("└── " if last else "├── ") + name + ("/" if is_dir else ""))
                      if is_dir:
                          walk(node[name], prefix + ("    " if last else "│   "))
              walk(root)
              return "\n".join(lines)

          tree_text = make_tree([p for p, _ in selected])
          preamble = (
              "ICIIA CRM - EXPORTACIÓN CONSOLIDADA PARA REVISIÓN TÉCNICA\n"
              f"Commit fuente exacto: {SOURCE_COMMIT}\n"
              "Rama fuente: main\n"
              "Repositorio: github.com/lucasbj2000/crm\n"
              "NOTA DE SEGURIDAD: sólo valores sensibles literales detectados fueron sustituidos por ***REDACTED***.\n"
              "Se excluyeron binarios y directorios node_modules/.git/dist/build.\n\n"
              "===== ÁRBOL DE DIRECTORIOS INCLUIDO =====\n"
              f"{tree_text}\n"
              "===== FIN ÁRBOL DE DIRECTORIOS =====\n\n"
          )

          blocks = []
          for rel, text in selected:
              blocks.append(
                  f"===== INICIO ARCHIVO: {rel} =====\n"
                  + text
                  + ("\n" if text and not text.endswith("\n") else "")
                  + f"===== FIN ARCHIVO: {rel} =====\n\n"
              )

          parts = []
          current = preamble
          current_files = []
          for (rel, _), block in zip(selected, blocks):
              if current_files and len(current.encode("utf-8")) + len(block.encode("utf-8")) > PART_LIMIT:
                  parts.append((current, current_files))
                  current = ""
                  current_files = []
              current += block
              current_files.append(rel)
          if current_files:
              parts.append((current, current_files))

          total = len(parts)
          manifest = [
              "ICIIA CRM - MANIFIESTO DE EXPORTACIÓN PARA COPILOT",
              f"Commit fuente exacto: {SOURCE_COMMIT}",
              f"Archivos de texto incluidos: {len(selected)}",
              f"Archivos binarios/no textuales excluidos: {len(skipped_binary)}",
              f"Partes: {total}",
              "",
          ]
          for idx, (_, files) in enumerate(parts, 1):
              fname = f"ICIIA_CRM_Codigo_Consolidado_parte_{idx}_de_{total}.txt"
              manifest.append(f"{fname} | {len(files)} archivos | {files[0]} -> {files[-1]}")

          for idx, (body, files) in enumerate(parts, 1):
              fname = OUT / f"ICIIA_CRM_Codigo_Consolidado_parte_{idx}_de_{total}.txt"
              fname.write_text(
                  f"PARTE {idx} DE {total}\nLeer las partes en orden numérico. Ningún archivo fuente fue dividido entre partes.\n\n" + body,
                  encoding="utf-8",
              )

          (OUT / "MANIFIESTO.txt").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          (OUT / "ARCHIVOS_EXCLUIDOS_BINARIOS.txt").write_text("\n".join(skipped_binary) + "\n", encoding="utf-8")
          print("\n".join(manifest))
          PY

      - name: Upload exact main source export
        uses: actions/upload-artifact@v4
        with:
          name: iciia-crm-copilot-source-export-v2
          path: copilot-source-export/
          if-no-files-found: error
          retention-days: 7
