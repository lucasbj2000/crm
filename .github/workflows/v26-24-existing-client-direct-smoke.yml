name: V26.24 existing client direct conversation smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  existing-client-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Syntax checks
        run: |
          node --check app/lib/v26-24-existing-client-direct-patches.mjs
          node --check app/server.mjs
          node --check app/test/v26-24-existing-client-direct.mjs
      - name: Validate branch-aware existing client flow
        run: node app/test/v26-24-existing-client-direct.mjs
      - name: Validate served app bundle
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          LOG="$TMP/server.log"
          BUNDLE="$TMP/app.js"
          PORT=6241 WHATSBOT_HOST=127.0.0.1 WHATSBOT_DATA_DIR="$TMP/data" WHATSAPP_MOCK=1 NO_OPEN=1 CRM_TENANT_SLUG=v2624-bundle CRM_PUBLIC_BASE_URL=http://127.0.0.1:6241 node app/server.mjs >"$LOG" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6241/api/health >/dev/null 2>&1; then OK=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep .2
          done
          if test "$OK" -eq 1; then
            curl -fsS http://127.0.0.1:6241/app.js -o "$BUNDLE"
            grep -q "V26.24 EXISTING_CLIENT_DIRECT_UI" "$BUNDLE"
            grep -q "Iniciar conversación desde mi sucursal" "$BUNDLE"
            grep -q "blocked_same_branch" "$BUNDLE"
          fi
          cat "$LOG" || true
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; fi
          test "$OK" -eq 1
