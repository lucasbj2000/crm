name: V26.43 simple responsive conversation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-43-simple-responsive-conversation"

permissions:
  contents: read

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-43-simple-responsive-conversation-patches.mjs
          node --check app/server.mjs
          node app/test/v26-43-simple-responsive-conversation.mjs
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3063"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2643-data
        run: |
          node app/server.mjs >/tmp/v2643.log 2>&1 &
          echo $! >/tmp/v2643.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3063/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3063/app.js -o /tmp/v2643-app.js
          node --check /tmp/v2643-app.js
          grep -F 'V26.43 SIMPLE_RESPONSIVE_CONVERSATION' /tmp/v2643-app.js
          grep -F 'const messages = Array.isArray(deal.messages) ? deal.messages : [];' /tmp/v2643-app.js
          grep -F 'v2643-simple-conversation-style' /tmp/v2643-app.js
          ! grep -F 'allMessages.slice(-visibleCount)' /tmp/v2643-app.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2643.pid || kill $(cat /tmp/v2643.pid) 2>/dev/null || true
          tail -120 /tmp/v2643.log 2>/dev/null || true
