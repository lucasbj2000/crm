name: V26.51 agent mobile inbox

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/v26-51-agent-mobile-inbox"

permissions:
  contents: read

jobs:
  mobile-agent-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Contracts
        run: |
          node --check app/lib/v26-51-agent-mobile-inbox-patches.mjs
          node --check app/server.mjs
          node --check app/public/sw.js
          node app/test/v26-51-agent-mobile-inbox.mjs
          bash -n scripts/deploy-vps.sh
          grep -F 'v26-51-agent-mobile-inbox-patches.mjs' scripts/deploy-vps.sh
          grep -F 'v26-51-agent-mobile-inbox.mjs' scripts/deploy-vps.sh

      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3067"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2651-data
        run: |
          node app/server.mjs >/tmp/v2651.log 2>&1 &
          echo $! >/tmp/v2651.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3067/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3067/app.js -o /tmp/v2651-app.js
          node --check /tmp/v2651-app.js
          grep -F 'V26.51 AGENT_MOBILE_INBOX' /tmp/v2651-app.js
          grep -F 'v2651-mobile-inbox' /tmp/v2651-app.js
          grep -F 'data-v2651-filter="pending"' /tmp/v2651-app.js
          grep -F 'data-v2651-filter="answered"' /tmp/v2651-app.js
          grep -F 'v2651BindTouchScroller' /tmp/v2651-app.js
          grep -F 'event.preventDefault()' /tmp/v2651-app.js
          grep -F 'data-v2651-close="won"' /tmp/v2651-app.js
          curl -fsS http://127.0.0.1:3067/sw.js -o /tmp/v2651-sw.js
          grep -F 'whatsbot-mobile-v26-51-agent-mobile-inbox' /tmp/v2651-sw.js

      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2651.pid || kill $(cat /tmp/v2651.pid) 2>/dev/null || true
          tail -180 /tmp/v2651.log 2>/dev/null || true
