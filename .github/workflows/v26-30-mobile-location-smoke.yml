name: V26.30 mobile and location smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-location:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Syntax and contract checks
        run: |
          node --check app/server.mjs
          node --check app/lib/v26-30-mobile-location-patches.mjs
          node app/test/v26-30-mobile-location.mjs
      - name: Start CRM in mock mode
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3050"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2630-data
        run: |
          node app/server.mjs > /tmp/v2630-server.log 2>&1 &
          echo $! > /tmp/v2630-server.pid
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:3050/api/health >/tmp/v2630-health.json; then exit 0; fi
            sleep 0.3
          done
          cat /tmp/v2630-server.log
          exit 1
      - name: Validate generated location readers
        run: |
          test -f app/.server-v24.generated.mjs
          node --check app/.server-v24.generated.mjs
          grep -F 'function v2630LocationText(location)' app/.server-v24.generated.mjs
          grep -F 'content.locationMessage || content.liveLocationMessage' app/.server-v24.generated.mjs
          grep -F 'const rawLocation=item.location||null' app/.server-v24.generated.mjs
          grep -F 'https://www.google.com/maps/search/?api=1&query=' app/.server-v24.generated.mjs
      - name: Validate served mobile bundle
        run: |
          curl -fsS http://127.0.0.1:3050/app.js -o /tmp/v2630-app.js
          node --check /tmp/v2630-app.js
          grep -F 'V26.30 MOBILE_LOCATION_UX' /tmp/v2630-app.js
          grep -F 'v2630-mobile-dock' /tmp/v2630-app.js
          grep -F 'board-column.mobile-active' /tmp/v2630-app.js
          grep -F 'Abrir ubicación exacta en Maps' /tmp/v2630-app.js
      - name: Stop mock CRM
        if: always()
        run: |
          if [ -f /tmp/v2630-server.pid ]; then kill $(cat /tmp/v2630-server.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2630-server.log ]; then tail -100 /tmp/v2630-server.log || true; fi
