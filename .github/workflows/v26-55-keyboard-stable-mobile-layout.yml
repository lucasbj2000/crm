name: V26.55 keyboard stable mobile layout

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-55-keyboard-stable-mobile-layout"

permissions:
  contents: read

jobs:
  keyboard-stable-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-55-keyboard-stable-mobile-layout-patches.mjs
          node --check app/server.mjs
          node --check app/public/sw.js
          node app/test/v26-54-mobile-detail-isolation.mjs
          node app/test/v26-55-keyboard-stable-mobile-layout.mjs
          bash -n scripts/deploy-vps.sh
          grep -F 'v26-55-keyboard-stable-mobile-layout-patches.mjs' scripts/deploy-vps.sh
          grep -F 'v26-55-keyboard-stable-mobile-layout.mjs' scripts/deploy-vps.sh
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3070"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2655-data
        run: |
          node app/server.mjs >/tmp/v2655.log 2>&1 &
          echo $! >/tmp/v2655.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3070/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3070/app.js -o /tmp/v2655-app.js
          node --check /tmp/v2655-app.js
          grep -F 'V26.55 KEYBOARD_STABLE_MOBILE_LAYOUT' /tmp/v2655-app.js
          grep -F 'v2655KeyboardInset' /tmp/v2655-app.js
          curl -fsS http://127.0.0.1:3070/styles.css -o /tmp/v2655.css
          grep -F 'V26.55 KEYBOARD STABLE MOBILE LAYOUT' /tmp/v2655.css
          grep -F 'height:var(--v2655-stable-vh,100dvh)!important' /tmp/v2655.css
          grep -F 'font-size:16px!important' /tmp/v2655.css
          curl -fsS http://127.0.0.1:3070/ -o /tmp/v2655-index.html
          grep -F '/styles.css?v=26.55-keyboard-stable-mobile' /tmp/v2655-index.html
          curl -fsS http://127.0.0.1:3070/sw.js -o /tmp/v2655-sw.js
          grep -F 'whatsbot-mobile-v26-55-keyboard-stable-mobile' /tmp/v2655-sw.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2655.pid || kill $(cat /tmp/v2655.pid) 2>/dev/null || true
          tail -160 /tmp/v2655.log 2>/dev/null || true
