name: V26.18.2 chat stability smoke

on:
  push:
    branches:
      - main
      - "fix/v26-18-1-fetch-stability"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate stable chat
        run: node app/test/v26-18-2-chat-stability.mjs
