name: V26.46 complete mobile recontact

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/v26-46-complete-mobile-recontact"

permissions:
  contents: read

jobs:
  mobile-recontact:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/public/app.js
          node --check app/lib/v26-46-complete-mobile-recontact-patches.mjs
          node --check app/lib/v26-38-closed-recontact-patches.mjs
          node --check app/server.mjs
          node app/test/v26-46-complete-mobile-recontact.mjs
          node app/test/v26-38-closed-recontact.mjs
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3066"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2646-data
        run: |
          node app/server.mjs >/tmp/v2646.log 2>&1 &
          echo $! >/tmp/v2646.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3066/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3066/app.js -o /tmp/v2646-app.js
          node --check /tmp/v2646-app.js
          grep -F 'V26.46 COMPLETE_MOBILE_RUNTIME' /tmp/v2646-app.js
          grep -F 'const canRecontactClosed = ["won", "lost"].includes(deal.stage);' /tmp/v2646-app.js
          grep -F 'V26.45 DEAL_CHAT_UNIFIED_INBOX_UI' /tmp/v2646-app.js
          grep -F 'panel.hidden = !active' /tmp/v2646-app.js
          curl -fsS http://127.0.0.1:3066/styles.css -o /tmp/v2646-styles.css
          grep -F 'V26.46 MOBILE PRODUCTION OVERRIDES' /tmp/v2646-styles.css
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2646.pid || kill $(cat /tmp/v2646.pid) 2>/dev/null || true
          tail -150 /tmp/v2646.log 2>/dev/null || true
