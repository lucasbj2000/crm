name: V26.9 access smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate V26.9 generator
        run: node app/test/v26-9-access-control.mjs
