name: V26.29 agent ownership and lead pool smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ownership-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Syntax checks
        run: |
          node --check app/server.mjs
          node --check app/lib/v26-29-agent-ownership-scope-patches.mjs
          node --check app/lib/v26-29-agent-ownership-ui-patches.mjs
      - name: Start CRM in mock mode
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3049"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2629-data
        run: |
          node app/server.mjs > /tmp/v2629-server.log 2>&1 &
          echo $! > /tmp/v2629-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3049/api/health >/tmp/v2629-health.json; then exit 0; fi
            sleep 0.3
          done
          cat /tmp/v2629-server.log
          exit 1
      - name: Validate generated ownership rules
        run: |
          test -f app/.server-v24.generated.mjs
          node --check app/.server-v24.generated.mjs
          grep -F 'V26.29 AGENT_OWNERSHIP_SCOPE' app/.server-v24.generated.mjs
          grep -F 'branchLeadPool = !deal.ownerUserId && deal.stage === STAGES.NEW' app/.server-v24.generated.mjs
          grep -F 'deal.assignmentSource = "branch_lead_pool"' app/.server-v24.generated.mjs
          grep -F 'canReassignTeam = ["admin", "manager", "supervisor"].includes(actor.role)' app/.server-v24.generated.mjs
          grep -F 'Solo podés asignar la negociación a un agente activo de tu sucursal.' app/.server-v24.generated.mjs
          grep -F 'if (user?.role === "agent") return { own: true, branch: false, team: false, global: false, audit: false };' app/.server-v24.generated.mjs
      - name: Validate served owner UI
        run: |
          curl -fsS http://127.0.0.1:3049/app.js -o /tmp/v2629-app.js
          node --check /tmp/v2629-app.js
          grep -F 'V26.29 AGENT_OWNERSHIP_UI' /tmp/v2629-app.js
          grep -F 'if (["manager", "supervisor"].includes(user.role)) return entry.role === "agent";' /tmp/v2629-app.js
      - name: Stop mock CRM
        if: always()
        run: |
          if [ -f /tmp/v2629-server.pid ]; then kill $(cat /tmp/v2629-server.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2629-server.log ]; then tail -100 /tmp/v2629-server.log || true; fi
