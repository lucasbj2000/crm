name: V26.20 automatic branch routing smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-branch-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Syntax checks
        run: |
          node --check app/lib/v26-20-auto-branch-routing-patches.mjs
          node --check app/server.mjs
      - name: Validate V26.20 automatic branch routing
        run: node app/test/v26-20-auto-branch-routing.mjs
      - name: Validate generated runtime startup
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          LOG="$TMP/server.log"
          PORT=6220 WHATSBOT_HOST=127.0.0.1 WHATSBOT_DATA_DIR="$TMP/data" WHATSAPP_MOCK=1 NO_OPEN=1 CRM_TENANT_SLUG=v2620-runtime CRM_PUBLIC_BASE_URL=http://127.0.0.1:6220 node app/server.mjs >"$LOG" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:6220/api/health >/dev/null 2>&1; then OK=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep .2
          done
          cat "$LOG" || true
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; fi
          test "$OK" -eq 1
