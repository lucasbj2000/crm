name: V26.53 transfer smoke startup

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-53-transfer-smoke-startup-timeout"

permissions:
  contents: read

jobs:
  transfer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Syntax
        run: node --check app/test/v24-transfer-smoke.mjs
      - name: Transfer smoke
        run: node app/test/v24-transfer-smoke.mjs
      - name: Deploy contract
        run: grep -F 'run_isolated_test "$STAGE/app/test/v24-transfer-smoke.mjs"' scripts/deploy-vps.sh
