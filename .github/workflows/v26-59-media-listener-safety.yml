name: V26.59 media listener safety

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-59-media-listener-leak"

permissions:
  contents: read

jobs:
  media-listener-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-59-media-listener-safety-patches.mjs
          node --check app/server.mjs
          node app/test/v26-5-media-reliability.mjs
          node app/test/v26-6-media-silent-sync.mjs
          node app/test/v26-59-media-listener-safety.mjs
          bash -n scripts/deploy-vps.sh
          grep -F 'v26-59-media-listener-safety-patches.mjs' scripts/deploy-vps.sh
          grep -F 'v26-59-media-listener-safety.mjs' scripts/deploy-vps.sh
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3073"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2659-data
        run: |
          node app/server.mjs >/tmp/v2659.log 2>&1 &
          echo $! >/tmp/v2659.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3073/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3073/api/health
          grep -F 'V26.59 MEDIA_LISTENER_SAFETY' app/.server-v24.generated.mjs
          grep -F 'v2659MaxPendingRefreshesPerSocket = 2' app/.server-v24.generated.mjs
          grep -F 'v2659AwaitMediaRefresh(message, socket)' app/.server-v24.generated.mjs
          if grep -F 'const refreshed = await socket.updateMediaMessage(message);' app/.server-v24.generated.mjs; then
            echo "Direct unbounded media refresh still present"
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2659.pid || kill $(cat /tmp/v2659.pid) 2>/dev/null || true
          tail -180 /tmp/v2659.log 2>/dev/null || true
