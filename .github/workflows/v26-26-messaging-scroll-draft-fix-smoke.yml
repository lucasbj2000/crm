name: V26.26 messaging scroll and draft fix smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  messaging-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Syntax checks
        run: |
          node --check app/lib/v26-26-messaging-scroll-draft-fix-patches.mjs
          node --check app/server.mjs
          node --check app/test/v26-26-messaging-scroll-draft-fix.mjs
      - name: Validate messaging regression fix
        run: node app/test/v26-26-messaging-scroll-draft-fix.mjs
      - name: Validate served app bundle
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          LOG="$TMP/server.log"
          BUNDLE="$TMP/app.js"
          PORT=6261 WHATSBOT_HOST=127.0.0.1 WHATSBOT_DATA_DIR="$TMP/data" WHATSAPP_MOCK=1 NO_OPEN=1 CRM_TENANT_SLUG=v2626-bundle CRM_PUBLIC_BASE_URL=http://127.0.0.1:6261 node app/server.mjs >"$LOG" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6261/api/health >/dev/null 2>&1; then OK=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep .2
          done
          if test "$OK" -eq 1; then
            curl -fsS http://127.0.0.1:6261/app.js -o "$BUNDLE"
            grep -q "V26.26 MESSAGING_SCROLL_DRAFT_FIX" "$BUNDLE"
            grep -q "v2626CancelPendingDrawerAutoScroll" "$BUNDLE"
            grep -q "v2626PrepareDraftForSend" "$BUNDLE"
            grep -q "touch-action:pan-y" "$BUNDLE"
          fi
          cat "$LOG" || true
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; fi
          test "$OK" -eq 1
