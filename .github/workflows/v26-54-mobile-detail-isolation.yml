name: V26.54 mobile detail isolation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/v26-54-mobile-detail-isolation"

permissions:
  contents: read

jobs:
  mobile-detail-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Contracts
        run: |
          node --check app/lib/v26-54-mobile-detail-isolation-patches.mjs
          node --check app/server.mjs
          node --check app/public/sw.js
          node app/test/v26-54-mobile-detail-isolation.mjs
          bash -n scripts/deploy-vps.sh
          grep -F 'v26-54-mobile-detail-isolation-patches.mjs' scripts/deploy-vps.sh
          grep -F 'v26-54-mobile-detail-isolation.mjs' scripts/deploy-vps.sh
      - name: Real runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3069"
          WHATSBOT_HOST: "127.0.0.1"
          WHATSBOT_DATA_DIR: ${{ runner.temp }}/v2654-data
        run: |
          node app/server.mjs >/tmp/v2654.log 2>&1 &
          echo $! >/tmp/v2654.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3069/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:3069/app.js -o /tmp/v2654-app.js
          node --check /tmp/v2654-app.js
          grep -F 'V26.54 MOBILE_DETAIL_ISOLATION' /tmp/v2654-app.js
          grep -F 'v2654-mobile-detail-open' /tmp/v2654-app.js
          curl -fsS http://127.0.0.1:3069/styles.css -o /tmp/v2654.css
          grep -F 'V26.54 MOBILE DETAIL ISOLATION' /tmp/v2654.css
          grep -F 'body.v2654-mobile-detail-open #app-shell' /tmp/v2654.css
          curl -fsS http://127.0.0.1:3069/ -o /tmp/v2654-index.html
          grep -F '/styles.css?v=26.54-mobile-detail-isolation' /tmp/v2654-index.html
          curl -fsS http://127.0.0.1:3069/sw.js -o /tmp/v2654-sw.js
          grep -F 'whatsbot-mobile-v26-54-mobile-detail-isolation' /tmp/v2654-sw.js
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/v2654.pid || kill $(cat /tmp/v2654.pid) 2>/dev/null || true
          tail -160 /tmp/v2654.log 2>/dev/null || true
