name: V26.21 chat scroll and bulk deals smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chat-scroll-bulk-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Syntax checks
        run: |
          node --check app/lib/v26-21-chat-scroll-bulk-deals-patches.mjs
          node --check app/server.mjs
      - name: Validate V26.21 behavior
        run: node app/test/v26-21-chat-scroll-bulk-deals.mjs
      - name: Validate generated runtime and served bundles
        shell: bash
        run: |
          set -u
          TMP="$(mktemp -d)"
          LOG="$TMP/server.log"
          PORT=6221 WHATSBOT_HOST=127.0.0.1 WHATSBOT_DATA_DIR="$TMP/data" WHATSAPP_MOCK=1 NO_OPEN=1 CRM_TENANT_SLUG=v2621-runtime CRM_PUBLIC_BASE_URL=http://127.0.0.1:6221 node app/server.mjs >"$LOG" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6221/api/health >/dev/null 2>&1; then OK=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep .2
          done
          if test "$OK" -eq 1; then
            curl -fsS http://127.0.0.1:6221/app.js -o "$TMP/app.js"
            curl -fsS http://127.0.0.1:6221/v25-11.js -o "$TMP/v25-11.js"
            grep -q "V26.21 BULK_DEAL_DELETE_UI" "$TMP/app.js"
            grep -q "V26.21 CHAT_ALWAYS_LATEST" "$TMP/v25-11.js"
          fi
          cat "$LOG" || true
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" || true; wait "$PID" || true; fi
          test "$OK" -eq 1
