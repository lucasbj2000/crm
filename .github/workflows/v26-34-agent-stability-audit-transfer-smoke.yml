name: V26.34 agent stability audit transfer smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  v2634:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Syntax checks
        run: |
          node --check app/server.mjs
          node --check app/server-core.mjs
          node --check app/lib/domain.mjs
          node --check app/lib/v26-31-notifications-fair-leads-patches.mjs
          node --check app/public/app.js
      - name: Validate V26.34 behavior
        run: node app/test/v26-34-agent-stability-audit-transfer.mjs
      - name: Validate generated server and served browser assets
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3054"
          WHATSBOT_HOST: "127.0.0.1"
        run: |
          export WHATSBOT_DATA_DIR="$RUNNER_TEMP/v2634-generated"
          node app/server.mjs > /tmp/v2634-server.log 2>&1 &
          echo $! > /tmp/v2634-server.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3054/api/health >/dev/null; then break; fi
            sleep 0.3
          done
          test -f app/.server-v24.generated.mjs
          node --check app/.server-v24.generated.mjs
          grep -F 'SESSION_TTL_MS = 30 * 24 * 60 * 60 * 1000' app/.server-v24.generated.mjs
          grep -F 'app.get("/api/deals/:id/history"' app/.server-v24.generated.mjs
          grep -F 'transferPending' app/.server-v24.generated.mjs
          curl -fsS http://127.0.0.1:3054/app.js -o /tmp/v2634-app.js
          node --check /tmp/v2634-app.js
          grep -F 'dealSearchQuery' /tmp/v2634-app.js
          grep -F 'fetchDealHistory' /tmp/v2634-app.js
          curl -fsS http://127.0.0.1:3054/ -o /tmp/v2634-index.html
          grep -F 'id="transfer-pending-section"' /tmp/v2634-index.html
          grep -F 'id="deal-history-section"' /tmp/v2634-index.html
          curl -fsS http://127.0.0.1:3054/styles.css -o /tmp/v2634-styles.css
          grep -F 'V26.34 · selección de texto' /tmp/v2634-styles.css
      - name: Stop mock CRM
        if: always()
        run: |
          if [ -f /tmp/v2634-server.pid ]; then kill $(cat /tmp/v2634-server.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2634-server.log ]; then tail -160 /tmp/v2634-server.log || true; fi
