name: V26.36 zero-loss incoming smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zero-loss-incoming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Syntax checks
        run: |
          node --check app/server.mjs
          node --check app/lib/domain.mjs
          node --check app/lib/v26-36-zero-loss-incoming-patches.mjs
          node --check app/test/v26-36-zero-loss-incoming.mjs
      - name: Validate zero-loss contracts
        run: node app/test/v26-36-zero-loss-incoming.mjs
      - name: Validate Cloud ingress remains operational
        run: node app/test/v26-35-ad-promotion-context.mjs
      - name: Validate generated runtime
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3056"
          WHATSBOT_HOST: "127.0.0.1"
        run: |
          export WHATSBOT_DATA_DIR="$RUNNER_TEMP/v2636-generated"
          node app/server.mjs > /tmp/v2636-server.log 2>&1 &
          echo $! > /tmp/v2636-server.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3056/api/health >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:3056/api/health
          test -f app/.server-v24.generated.mjs
          node --check app/.server-v24.generated.mjs
          grep -F 'pendingIncomingEvents' app/.server-v24.generated.mjs
          grep -F 'pendingCloudWebhooks' app/.server-v24.generated.mjs
          grep -F 'source === "notify" || source === "append"' app/.server-v24.generated.mjs
      - name: Stop mock CRM
        if: always()
        run: |
          if [ -f /tmp/v2636-server.pid ]; then kill $(cat /tmp/v2636-server.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2636-server.log ]; then tail -160 /tmp/v2636-server.log || true; fi
