name: Copilot source export v3 final

on:
  push:
    branches:
      - copilot-source-export-20260915

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source commit
        uses: actions/checkout@v4
        with:
          ref: d105d8b978c00a786421f6847d81db841b360ddb
          fetch-depth: 1

      - name: Build exact source export with conservative secret redaction
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import math
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / "copilot-source-export"
          OUT.mkdir(exist_ok=True)
          PART_LIMIT = 1_800_000
          SOURCE_COMMIT = "d105d8b978c00a786421f6847d81db841b360ddb"

          EXCLUDED_DIR_NAMES = {"node_modules", ".git", "dist", "build"}
          BINARY_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".bmp", ".tif", ".tiff",
              ".pdf", ".zip", ".gz", ".tgz", ".tar", ".7z", ".rar", ".woff", ".woff2", ".ttf", ".otf",
              ".mp3", ".wav", ".ogg", ".m4a", ".mp4", ".mov", ".avi", ".webm", ".sqlite", ".db", ".bin",
              ".exe", ".dll", ".so", ".dylib", ".class", ".jar", ".pyc"
          }
          ENV_FILE_RE = re.compile(r"^\.env(?:\..+)?$", re.I)
          PEM_RE = re.compile(
              r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----",
              re.S,
          )
          BEARER_RE = re.compile(r"(?i)(bearer\s+)([A-Za-z0-9._~+/=-]{24,})")
          KNOWN_TOKEN_RE = re.compile(
              r"(?<![A-Za-z0-9])(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|EAA[A-Za-z0-9]{30,})(?![A-Za-z0-9])"
          )
          SECRET_NAME_RE = re.compile(
              r"(?i)(secret|token|password|passwd|pwd|api[_-]?key|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|auth[_-]?token|webhook[_-]?secret|signing[_-]?key|connection[_-]?string)"
          )
          QUOTED_ASSIGN_RE = re.compile(
              r'''(?im)^(?P<prefix>\s*(?:(?:const|let|var|export)\s+)?(?P<key>[A-Za-z_][A-Za-z0-9_.-]*)\s*(?:=|:)\s*)(?P<q>["'])(?P<value>[^"'\r\n]+)(?P=q)(?P<suffix>\s*[,;]?\s*)$'''
          )

          def tracked_files():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          def excluded_path(path: str) -> bool:
              parts = Path(path).parts
              return any(p in EXCLUDED_DIR_NAMES for p in parts) or Path(path).suffix.lower() in BINARY_EXTS

          def read_text(path: Path):
              data = path.read_bytes()
              if b"\x00" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  try:
                      return data.decode("latin-1")
                  except Exception:
                      return None

          def entropy(value: str) -> float:
              if not value:
                  return 0.0
              counts = {c: value.count(c) for c in set(value)}
              n = len(value)
              return -sum((cnt/n) * math.log2(cnt/n) for cnt in counts.values())

          def looks_like_real_secret(value: str) -> bool:
              if len(value) < 24:
                  return False
              low = value.lower()
              placeholder_bits = ("example", "placeholder", "changeme", "your_", "your-", "test", "dummy", "sample", "localhost", "/api/")
              if any(bit in low for bit in placeholder_bits):
                  return False
              classes = sum([
                  any(c.islower() for c in value),
                  any(c.isupper() for c in value),
                  any(c.isdigit() for c in value),
                  any(not c.isalnum() for c in value),
              ])
              return classes >= 2 and entropy(value) >= 3.6

          def redact_env(text: str) -> str:
              out = []
              for raw in text.splitlines(keepends=True):
                  nl = "\n" if raw.endswith("\n") else ""
                  line = raw[:-1] if nl else raw
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      out.append(raw)
                      continue
                  m = re.match(r"^(\s*(?:export\s+)?[A-Za-z_][A-Za-z0-9_]*\s*=\s*)(.*)$", line)
                  out.append((m.group(1) + "***REDACTED***" if m else "***REDACTED***") + nl)
              return "".join(out)

          def redact_secrets(path: str, text: str) -> str:
              if ENV_FILE_RE.match(Path(path).name):
                  return redact_env(text)
              text = PEM_RE.sub("***REDACTED_PRIVATE_KEY***", text)
              text = BEARER_RE.sub(lambda m: m.group(1) + "***REDACTED***" if looks_like_real_secret(m.group(2)) else m.group(0), text)
              text = KNOWN_TOKEN_RE.sub("***REDACTED***", text)
              def repl(m):
                  if SECRET_NAME_RE.search(m.group("key")) and looks_like_real_secret(m.group("value")):
                      return m.group("prefix") + m.group("q") + "***REDACTED***" + m.group("q") + m.group("suffix")
                  return m.group(0)
              return QUOTED_ASSIGN_RE.sub(repl, text)

          selected = []
          skipped_binary = []
          for rel in tracked_files():
              if excluded_path(rel):
                  skipped_binary.append(rel)
                  continue
              p = ROOT / rel
              if not p.is_file():
                  continue
              text = read_text(p)
              if text is None:
                  skipped_binary.append(rel)
                  continue
              selected.append((rel, redact_secrets(rel, text)))
          selected.sort(key=lambda x: x[0].lower())

          def make_tree(paths):
              root = {}
              for path in paths:
                  node = root
                  parts = Path(path).parts
                  for part in parts[:-1]:
                      node = node.setdefault(part, {})
                  node.setdefault("__files__", []).append(parts[-1])
              lines = ["."]
              def walk(node, prefix=""):
                  dirs = sorted([k for k in node if k != "__files__"], key=str.lower)
                  files = sorted(node.get("__files__", []), key=str.lower)
                  entries = [(x, True) for x in dirs] + [(x, False) for x in files]
                  for i, (name, is_dir) in enumerate(entries):
                      last = i == len(entries)-1
                      lines.append(prefix + ("└── " if last else "├── ") + name + ("/" if is_dir else ""))
                      if is_dir:
                          walk(node[name], prefix + ("    " if last else "│   "))
              walk(root)
              return "\n".join(lines)

          tree_text = make_tree([p for p, _ in selected])
          preamble = (
              "ICIIA CRM - EXPORTACIÓN CONSOLIDADA PARA REVISIÓN TÉCNICA\n"
              f"Commit fuente exacto: {SOURCE_COMMIT}\n"
              "Rama fuente: main\n"
              "Repositorio: github.com/lucasbj2000/crm\n"
              "SEGURIDAD: código literal; sólo secretos reales detectables, .env y claves privadas son redactados.\n"
              "Se excluyeron binarios y directorios node_modules/.git/dist/build.\n\n"
              "===== ÁRBOL DE DIRECTORIOS INCLUIDO =====\n" + tree_text + "\n===== FIN ÁRBOL DE DIRECTORIOS =====\n\n"
          )

          blocks = []
          for rel, text in selected:
              blocks.append(
                  f"===== INICIO ARCHIVO: {rel} =====\n" + text +
                  ("\n" if text and not text.endswith("\n") else "") +
                  f"===== FIN ARCHIVO: {rel} =====\n\n"
              )

          parts, current, current_files = [], preamble, []
          for (rel, _), block in zip(selected, blocks):
              if current_files and len(current.encode()) + len(block.encode()) > PART_LIMIT:
                  parts.append((current, current_files)); current=""; current_files=[]
              current += block; current_files.append(rel)
          if current_files:
              parts.append((current, current_files))

          total = len(parts)
          manifest = [
              "ICIIA CRM - MANIFIESTO DE EXPORTACIÓN PARA COPILOT",
              f"Commit fuente exacto: {SOURCE_COMMIT}",
              f"Archivos de texto incluidos: {len(selected)}",
              f"Archivos binarios/no textuales excluidos: {len(skipped_binary)}",
              f"Partes: {total}", ""
          ]
          for idx, (_, files) in enumerate(parts, 1):
              name = f"ICIIA_CRM_Codigo_Consolidado_parte_{idx}_de_{total}.txt"
              manifest.append(f"{name} | {len(files)} archivos | {files[0]} -> {files[-1]}")
              (OUT / name).write_text(
                  f"PARTE {idx} DE {total}\nLeer las partes en orden numérico. Ningún archivo fuente fue dividido entre partes.\n\n" + parts[idx-1][0],
                  encoding="utf-8"
              )
          (OUT / "MANIFIESTO.txt").write_text("\n".join(manifest)+"\n", encoding="utf-8")
          (OUT / "ARCHIVOS_EXCLUIDOS_BINARIOS.txt").write_text("\n".join(skipped_binary)+"\n", encoding="utf-8")
          print("\n".join(manifest))
          PY

      - name: Upload final exact main source export
        uses: actions/upload-artifact@v4
        with:
          name: iciia-crm-copilot-source-export-final
          path: copilot-source-export/
          if-no-files-found: error
          retention-days: 7
