name: V26.37 guardian 24x7 smoke

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/v26-37-guardian-24x7"

permissions:
  contents: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Syntax
        run: |
          node --check app/lib/v26-37-guardian-24x7-patches.mjs
          node --check app/test/v26-37-guardian-24x7.mjs
          node --check gateway/lib/v26-37-guardian-24x7-patches.mjs
          node --check gateway/test/v26-37-guardian-24x7.mjs
          node --check app/server.mjs
          node --check gateway/v25-gateway.mjs
      - name: Contracts
        run: |
          node app/test/v26-37-guardian-24x7.mjs
          node gateway/test/v26-37-guardian-24x7.mjs
      - name: Tenant runtime health
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3067"
          WHATSBOT_HOST: "127.0.0.1"
          NO_OPEN: "1"
        run: |
          export WHATSBOT_DATA_DIR="$RUNNER_TEMP/v2637-app"
          node app/server.mjs > /tmp/v2637-app.log 2>&1 &
          echo $! > /tmp/v2637-app.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3067/api/health > /tmp/v2637-health.json; then break; fi
            sleep 0.25
          done
          node -e 'const j=require("/tmp/v2637-health.json"); if(!j.ok||!j.guardian||typeof j.uptimeSeconds!=="number") process.exit(1)'
          node --check app/.server-v24.generated.mjs
      - name: Gateway no-user guardian
        env:
          WHATSAPP_MOCK: "1"
          PORT: "3068"
          GATEWAY_HOST: "127.0.0.1"
          CRM_GATEWAY_SECRET: "v2637-ci-secret"
        run: |
          export CRM_STORAGE_DIR="$RUNNER_TEMP/v2637-gateway"
          node gateway/v25-gateway.mjs > /tmp/v2637-gateway.log 2>&1 &
          echo $! > /tmp/v2637-gateway.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3068/api/health > /tmp/v2637-gateway-health.json; then break; fi
            sleep 0.25
          done
          sleep 17
          curl -fsS http://127.0.0.1:3068/api/health > /tmp/v2637-gateway-health.json
          node -e 'const j=require("/tmp/v2637-gateway-health.json"); if(!j.ok||!j.guardian||!j.guardian.tenants||!j.guardian.tenants.main||j.guardian.tenants.main.checks<1) process.exit(1)'
          node --check gateway/.gateway-v25.generated.mjs
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/v2637-gateway.pid ]; then kill $(cat /tmp/v2637-gateway.pid) 2>/dev/null || true; fi
          if [ -f /tmp/v2637-app.pid ]; then kill $(cat /tmp/v2637-app.pid) 2>/dev/null || true; fi
          sleep 1
          tail -120 /tmp/v2637-app.log 2>/dev/null || true
          tail -160 /tmp/v2637-gateway.log 2>/dev/null || true
