<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM V23 · Administrador Maestro</title><style>
:root{--orange:#ff7a00;--black:#111;--bg:#f4f4f5;--line:#e1e1e4}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:#19191b}.top{height:68px;background:#111;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top b{font-size:15px}.top span{font-size:11px;color:#aaa}.shell{width:min(1180px,calc(100% - 32px));margin:24px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.card h2,.card h3{margin:0 0 6px}.muted{color:#777;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:6px}.field span{font-size:10px;font-weight:800;text-transform:uppercase;color:#666}.field input{height:43px;border:1px solid #d8d8dd;border-radius:11px;padding:0 12px}.actions{display:flex;gap:8px;margin-top:14px}.btn{height:40px;padding:0 14px;border:1px solid #d9d9dd;border-radius:10px;background:white;font-weight:750;cursor:pointer}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.orange{background:var(--orange);color:#111;border-color:var(--orange)}.companies{display:grid;gap:8px;margin-top:14px}.company{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:13px}.company>div:last-child{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap}.company b,.company small{display:block}.company small{color:#777;margin-top:3px}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:#eee}.pill.on{background:#e6f5ea;color:#18753a}.error{color:#b42318;font-size:12px;margin-top:10px}.hidden{display:none!important}@media(max-width:760px){.grid,.company{grid-template-columns:1fr}.company>div:last-child{justify-content:flex-start}}</style></head><body><header class="top"><div><b>Administrador Maestro · CRM V23</b><span>Gestión de empresas aisladas</span></div><button class="btn" onclick="location.href='/login'">Ir al CRM</button></header><main class="shell"><section class="card" id="loginCard"><h2>Acceso Maestro</h2><p class="muted" id="setupNote">Usá la contraseña maestra configurada en el VPS.</p><div class="grid"><label class="field"><span>Contraseña maestra</span><input id="masterPass" type="password"></label></div><div class="actions"><button class="btn primary" id="masterLogin">Ingresar</button></div><div class="error" id="loginError"></div></section><section id="admin" class="hidden"><section class="card"><h2>Nueva empresa</h2><p class="muted">Crea una base, usuarios y sesión de WhatsApp completamente separadas.</p><div class="grid"><label class="field"><span>Empresa</span><input id="name" placeholder="Empresa Demo"></label><label class="field"><span>Código de acceso</span><input id="code" placeholder="demo"></label><label class="field"><span>Usuario administrador</span><input id="adminUser" value="admin"></label><label class="field"><span>Nombre administrador</span><input id="adminName" value="Administrador"></label><label class="field"><span>Contraseña inicial</span><input id="adminPass" type="password" placeholder="Mínimo 8 caracteres"></label><label class="field"><span>Color principal</span><input id="primary" type="color" value="#171717"></label><label class="field"><span>Color acento</span><input id="accent" type="color" value="#ff7a00"></label></div><div class="actions"><button class="btn orange" id="create">Crear empresa</button></div><div class="error" id="createError"></div></section><section class="card"><h3>Empresas</h3><p class="muted">El código es el dato que el agente introduce antes de usuario y contraseña.</p><div id="companies" class="companies"></div></section></section></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Error');return x}async function status(){const s=await api('/api/gateway/master/status');if(!s.configured)$('#setupNote').textContent='Aún no configuraste la clave maestra. En Terminal ejecutá: node gateway/setup-master.mjs "TU_CLAVE_SEGURA"';if(s.authenticated)show()}async function show(){$('#loginCard').classList.add('hidden');$('#admin').classList.remove('hidden');load()}async function selectCompany(slug,view='crm'){await api('/api/gateway/master/select-company',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({slug})});location.href='/?view='+encodeURIComponent(view)}async function load(){const x=await api('/api/gateway/master/companies');$('#companies').innerHTML=x.companies.map(c=>`<div class="company"><div><b>${esc(c.name)}</b><small>Código: ${esc(c.code)} · Base y sesiones aisladas</small></div><div><span class="pill ${c.active!==false?'on':''}">${c.active!==false?'ACTIVA':'PAUSADA'}</span> <button class="btn orange" data-open="${esc(c.slug)}">Administrar</button> <button class="btn" data-design="${esc(c.slug)}">Diseño</button> <button class="btn" data-restart="${esc(c.slug)}">Reiniciar</button></div></div>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>selectCompany(b.dataset.open));document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>selectCompany(b.dataset.design,'design'));document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=async()=>{b.disabled=true;await api('/api/gateway/master/companies/'+b.dataset.restart+'/restart',{method:'POST'});b.disabled=false;load()})}$('#masterLogin').onclick=async()=>{try{await api('/api/gateway/master/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#masterPass').value})});show()}catch(e){$('#loginError').textContent=e.message}};$('#create').onclick=async()=>{try{$('#createError').textContent='';await api('/api/gateway/master/companies',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('#name').value,code:$('#code').value,adminUsername:$('#adminUser').value,adminName:$('#adminName').value,adminPassword:$('#adminPass').value,primaryColor:$('#primary').value,accentColor:$('#accent').value})});$('#name').value='';$('#code').value='';$('#adminPass').value='';load()}catch(e){$('#createError').textContent=e.message}};status()</script></body></html>
